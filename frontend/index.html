<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toast n Taste</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container text-center mt-5">
    <h1>Toast n Taste</h1>
    <p>Order your favorite food online!</p>
    <form id="orderForm" class="mt-4">
      <input type="text" class="form-control mb-3" placeholder="Enter food item" id="foodItem" required>
      <input type="number" class="form-control mb-3" placeholder="Quantity" id="quantity" required>
      <button class="btn btn-primary" type="submit">Place Order</button>
    </form>
    <div id="message" class="mt-3"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
